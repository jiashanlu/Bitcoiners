services:
  - type: web
    name: bitcoiners-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /ws/*
        destination: wss://bitcoiners-backend.onrender.com/ws
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://www.bitcoiners.ae/api
      - key: VITE_WS_URL
        value: wss://www.bitcoiners.ae/ws

  - type: web
    name: bitcoiners-backend
    env: node
    region: oregon
    buildCommand: |
      cd backend
      npm ci
      npm run build
      export NODE_ENV=production
      export DATABASE_URL=$DATABASE_URL
      npm run migration:run
    startCommand: cd backend && node dist/index.js
    healthCheckPath: /health
    plan: starter
    autoDeploy: false
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: postgres://bitcoiners:J166uZpcJhEQZrbMGNZ5JllPnwGgjfUL@dpg-ctkl64l2ng1s73bqr0l0-a.oregon-postgres.render.com/bitcoiners_2vk9?sslmode=no-verify
      - key: REDIS_URL
        value: rediss://red-ctkl64l2ng1s73bqr0kg:5mmUe6JKpYRzMlioIqGYaeYt6GHSkb3y@oregon-redis.render.com:6379

  - type: redis
    name: bitcoiners-redis
    ipAllowList:
      - source: 0.0.0.0/0
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: bitcoiners-db
    databaseName: bitcoiners
    user: bitcoiners
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
    region: oregon
